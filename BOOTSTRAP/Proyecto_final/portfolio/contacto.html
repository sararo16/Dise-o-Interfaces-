<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Contacto - San Juan de la Arena</title>

    <!-- CSS de Bootstrap -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <!-- CSS Propio -->

    <link rel="stylesheet" href="../CSS/estilos.css" />
  </head>

  <body>
    <div class="container-fluid px-0">
      <!-- FILA DE NAVBAR -->

      <div class="row m-0 sticky-top shadow">
        <div class="col-12 p-0">
          <nav class="navbar navbar-expand-lg navbar-dark bg-azul py-2">
            <div class="container-fluid px-4">
              <a class="navbar-brand" href="../index.html">
                <img
                  src="../imagenes/LOGO.png"
                  alt="Logo San Juan"
                  width="70"
                  height="70"
                  class="me-2 rounded-circle"
                />
              </a>

              <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#Menu"
                aria-controls="Menu"
                aria-expanded="false"
                aria-label="Toggle navigation"
              >
                <span class="navbar-toggler-icon"></span>
              </button>

              <div class="collapse navbar-collapse" id="Menu">
                <ul
                  class="navbar-nav ms-auto mb-2 mb-lg-0 text-uppercase fw-semibold"
                >
                  <li class="nav-item">
                    <a class="nav-link enlace-menu" href="../index.html"
                      >Inicio</a
                    >
                  </li>
                  <li class="nav-item">
                    <a class="nav-link enlace-menu" href="historia.html"
                      >Historia</a
                    >
                  </li>
                  <li class="nav-item">
                    <a
                      class="nav-link active enlace-menu"
                      aria-current="page"
                      href="contacto.html"
                      >Contacto</a
                    >
                  </li>
                </ul>
              </div>
            </div>
          </nav>
        </div>
      </div>
      <!-- FILA DE ENCABEZADO DE CONTACTO -->

      <header
        class="row m-0 bg-fondo py-5 text-center justify-content-center mb-5 seccion-historia"
      >
        <div class="col-12 col-md-8">
          <small class="hero_up text-uppercase">Asturias · 24 de junio</small>
          <h1 class="titulo display-4 fw-bold mt-2">Contacto</h1>
          <p class="subtitulo fst-italic">
            ¿Tienes alguna duda, sugerencia o quieres colaborar con las Fiestas
            de San Juan de la Arena? Escríbenos y nos pondremos en contacto
            contigo lo antes posible.
          </p>
        </div>
      </header>

      <!--fORMULARIO-->
      <main class="row m-0 justify-content-center mb-5 px-3">
        <div class="col-12 col-md-8 col-lg-6">
          <div
            class="card shadow-lg border-0 rounded-4 p-4 p-md-5 bg-fondo card-contacto"
          >
            <form>
              <div class="mb-3">
                <label for="nombre" class="form-label fw-semibold"
                  >Nombre completo</label
                >
                <input
                  type="text"
                  class="form-control bg-light"
                  id="nombre"
                  placeholder="Ej: María Fernández"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="email" class="form-label fw-semibold"
                  >Correo electrónico</label
                >
                <input
                  type="email"
                  class="form-control bg-light"
                  id="email"
                  placeholder="nombre@ejemplo.com"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="asunto" class="form-label fw-semibold"
                  >Asunto</label
                >
                <input
                  type="text"
                  class="form-control bg-light"
                  id="asunto"
                  placeholder="¿En qué te podemos ayudar?"
                  required
                />
              </div>

              <div class="mb-4">
                <label for="mensaje" class="form-label fw-semibold"
                  >Mensaje</label
                >
                <textarea
                  class="form-control bg-light"
                  id="mensaje"
                  rows="5"
                  placeholder="Escribe tu mensaje aquí..."
                  required
                ></textarea>
              </div>

              <div class="d-grid mt-2">
                <button type="submit" class="btn btn-lg btn-arena shadow-sm">
                  Enviar mensaje
                </button>
              </div>
            </form>
          </div>
        </div>
      </main>

      <footer class="row m-0 bg-dark py-4 align-items-center bg-azul">
        <div
          class="col-12 col-md-6 text-light text-center text-md-start px-5 mb-3 mb-md-0"
        >
          <p class="mb-0">Soto del barco | Asturias</p>
        </div>

        <div
          class="col-12 col-md-6 d-flex justify-content-center justify-content-md-end px-5"
        >
          <img
            src="../imagenes/facebooks.png"
            class="img-fluid mx-2"
            alt="Facebook"
            width="40"
            height="40"
          />
          <img
            src="../imagenes/instagram.png"
            class="img-fluid mx-2"
            alt="Instagram"
            width="40"
            height="40"
          />
        </div>
      </footer>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
